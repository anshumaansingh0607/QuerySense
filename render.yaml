services:
  - type: web
    name: querysense
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: mock
      - key: AMBIGUITY_THRESHOLD
        value: "0.65"
      # To use a real LLM, add your API keys in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
