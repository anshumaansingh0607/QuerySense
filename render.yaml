services:
  - type: web
    name: querysense
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: mock
      - key: AMBIGUITY_THRESHOLD
        value: "0.7"
      # To use a real LLM, add your OPENAI_API_KEY in the Render dashboard later
      - key: OPENAI_API_KEY
        sync: false
